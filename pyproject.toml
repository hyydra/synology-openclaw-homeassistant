[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-kereso-crawler"
version = "0.1.0"
description = "Historical Hungarian/Pécs source discovery crawler for Retro Kereső"
requires-python = ">=3.11"
dependencies = [
  "Scrapy>=2.17,<3",
  "Scrapling>=0.4.14,<0.5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
